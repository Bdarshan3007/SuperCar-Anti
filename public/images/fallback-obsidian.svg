<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06070a" />
      <stop offset="50%" stop-color="#0c0e14" />
      <stop offset="100%" stop-color="#06070a" />
    </linearGradient>
    <linearGradient id="emblemGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3847" />
      <stop offset="100%" stop-color="#80141d" />
    </linearGradient>
    <linearGradient id="metallic" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a2e39" />
      <stop offset="50%" stop-color="#8e939c" />
      <stop offset="100%" stop-color="#2a2e39" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255, 56, 71, 0.08)" />
      <stop offset="100%" stop-color="rgba(6, 7, 10, 0)" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)" />
  <circle cx="600" cy="337" r="450" fill="url(#centerGlow)" />

  <!-- Subtle Blueprint Grid -->
  <g opacity="0.12" stroke="#4a5260" stroke-width="1">
    <line x1="0" y1="337" x2="1200" y2="337" stroke-dasharray="8 8" />
    <line x1="600" y1="0" x2="600" y2="675" stroke-dasharray="8 8" />
    <circle cx="600" cy="337" r="180" fill="none" stroke-dasharray="4 6" />
    <circle cx="600" cy="337" r="280" fill="none" stroke-dasharray="2 8" />
  </g>

  <!-- Corner Hairline Framing -->
  <g stroke="#ff3847" stroke-width="2" opacity="0.6" fill="none">
    <path d="M 40 70 L 40 40 L 70 40" />
    <path d="M 1160 70 L 1160 40 L 1130 40" />
    <path d="M 40 605 L 40 635 L 70 635" />
    <path d="M 1160 605 L 1160 635 L 1130 635" />
  </g>

  <!-- AURA Emblem Symbol -->
  <g transform="translate(600, 290)">
    <!-- Outer Shield / Diamond Polygon -->
    <polygon points="0,-70 60,-15 45,55 0,75 -45,55 -60,-15" fill="none" stroke="url(#metallic)" stroke-width="2.5" />
    <!-- Inner Precision Core -->
    <polygon points="0,-45 38,-10 28,35 0,50 -28,35 -38,-10" fill="none" stroke="url(#emblemGlow)" stroke-width="2" />
    <circle cx="0" cy="0" r="8" fill="#ff3847" />
    <line x1="-80" y1="0" x2="-65" y2="0" stroke="#ff3847" stroke-width="2" />
    <line x1="65" y1="0" x2="80" y2="0" stroke="#ff3847" stroke-width="2" />
  </g>

  <!-- Branded Typography -->
  <text x="600" y="420" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="24" font-weight="800" letter-spacing="8" fill="#ffffff" text-anchor="middle">AURA ATELIER</text>
  <text x="600" y="455" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="4" fill="#8e939c" text-anchor="middle">SPECIFICATION ARCHIVE // TELEMETRY STANDBY</text>
  <text x="600" y="480" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="2" fill="#4a5260" text-anchor="middle">HIGH-FIDELITY ASSET RENDERING IN PROGRESS</text>
</svg>
